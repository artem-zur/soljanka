<img ngSrc="pokemon-logo.png" width="220" height="80" class="mx-auto mb-4" priority />

@let pokemons = pokemonList();

@if (pokemons.length > 0) {
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
    @for (pokemon of pokemons; track pokemon.name) {
      <app-pokemon-card [pokemon]="pokemon"></app-pokemon-card>
    }
  </div>
}

@if (hasMore() && !isLoading()) {
  <div appPokemonInfiniteScroll (scrolled)="loadNextBatch()"></div>
}

@if (isLoading()) {
  <app-pokeball />
}
